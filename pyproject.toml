[project]
name = "ereborpriors"
version = "0.1.0"
description = "Priors used in the Erebor global fit for the analysis of the DDPC common datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=7.2.0",
    "eryn",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
